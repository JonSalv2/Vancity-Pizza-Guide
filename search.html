<!DOCTYPE html>
<html lang="en">

    <!-- Search – Displays the pizza search page for browsing places by style. -->
    <!-- Shared metadata, global styles, and the scripts that power navigation and filtering. -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Search | Vancity Pizza Guide</title>
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <script src="js/nav.js" defer></script>
        <script src="js/pizza-data.js" defer></script>
        <script src="js/search.js" defer></script>
    </head>

    <body class="search-page">

        <!-- Shared site header with the brand link and responsive navigation. -->
        <header class="site-header">
            <div class="site-header__inner">
                <h1 class="site-title">
                    <a href="index.html">
                        <img src="images/site-logo.jpg" alt="Vancity Pizza Guide">
                    </a>
                </h1>

                <button class="menu-toggle" type="button">
                    <img src="images/icons/menu-icon.png" alt="Menu">
                </button>

                <nav class="site-nav">
                    <a href="index.html">Home</a>
                    <a href="search.html" class="is-current">Search</a>
                    <a href="styles.html">Styles</a>
                    <a href="history.html">History</a>
                    <a href="submit.html">Submit</a>
                    <a href="lorem.html">Lorem</a>
                </nav>
            </div>
        </header>

        <main>
            <!-- Hero banner introduces the page with a consistent photo treatment. -->
            <section class="hero">
                <h2>Search Pizza Places</h2>
                <p>Browse Vancouver pizza spots by pizza style.</p>
            </section>

            <!-- The filter controls and result cards stay grouped so the interaction is easy to scan. -->
            <div class="page-content">
                <section class="search-section">
                    <h2>Find the slice you're looking for</h2>

                    <h3>Filter by Style</h3>

                    <form class="search-form">
                        <div class="form-row">
                            <label for="style-filter">Choose a pizza style</label>
                            <select id="style-filter" name="style">
                                <option value="all">All Styles</option>
                                <option value="Neapolitan">Neapolitan</option>
                                <option value="New York">New York</option>
                                <option value="By the Slice">By the Slice</option>
                                <option value="Modern">Modern</option>
                                <option value="Taglio">Taglio</option>
                            </select>
                        </div>

                        <div class="form-buttons">
                            <button type="button" id="show-all-button">Show All</button>
                        </div>
                    </form>
                </section>

                <section>
                    <h2>Results</h2>
                    <p id="results-message">Choose a pizza style or click Show All.</p>
                    <div id="results-container" class="results-grid"></div>
                </section>
            </div>
            
        </main>

        <!-- Shared footer repeats the social links and site copyright. -->
        <footer>
            <div class="footer-socials">
                <a href="#" class="footer-social-link footer-social-link--instagram" title="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                </a>
                <a href="#" class="footer-social-link footer-social-link--tiktok" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>TikTok</span>
                </a>
                <a href="#" class="footer-social-link footer-social-link--facebook" title="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                    <span>Facebook</span>
                </a>
            </div>
            <p>&copy; 2026 Vancity Pizza Guide</p>
        </footer>
        
    </body>
</html>
