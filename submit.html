<!DOCTYPE html>
<html lang="en">

    <!-- Submit – Allows users to submit their own pizza recommendations through a form. -->
    <!-- Shared metadata, global styles, and the mobile navigation script. -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Submit | Vancity Pizza Guide</title>
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <script src="js/nav.js" defer></script>
    </head>

    <body>

        <!-- Shared site header with the brand link and responsive navigation. -->
        <header class="site-header">
            <div class="site-header__inner">
                <h1 class="site-title">
                    <a href="index.html">Vancity Pizza Guide</a>
                </h1>

                <button class="menu-toggle" type="button">
                    <img src="images/icons/menu-icon.png" alt="Menu">
                </button>

                <nav class="site-nav">
                    <a href="index.html">Home</a>
                    <a href="search.html">Search</a>
                    <a href="styles.html">Styles</a>
                    <a href="history.html">History</a>
                    <a href="submit.html" class="is-current">Submit</a>
                    <a href="lorem.html">Lorem</a>
                </nav>
            </div>
        </header>
        
        <main>
            <!-- Hero banner introduces the page with a consistent photo treatment. -->
            <section class="hero">
                <h2>Submit a Recommendation</h2>
                <p> Share your favourite slice!</p>
            </section>

            <!-- The recommendation form stays narrow so each field remains easy to complete. -->
            <div class="page-content">
                <section class="recommendation-form-section">

                <form class="recommendation-form" action="#" method="post">
                    <div class="form-group">
                        <label for="name" class="visually-hidden">Your Name (optional)</label>
                        <input type="text" id="name" name="name" placeholder="Your Name (optional)">
                    </div>

                    <div class="form-group">
                        <label for="email" class="visually-hidden">Your Email</label>
                        <input type="email" id="email" name="email" placeholder="Your Email" required>
                    </div>

                    <div class="form-group">
                        <label for="pizza-place" class="visually-hidden">Pizza Place Name</label>
                        <input type="text" id="pizza-place" name="pizza_place" placeholder="Pizza Place Name" required>
                    </div>

                    <div class="form-group">
                        <label for="pizza-place-address" class="visually-hidden">Pizza Place Address</label>
                        <input type="text" id="pizza-place-address" name="pizza_place_address" placeholder="Pizza Place Address" required>
                    </div>

                    <div class="form-group">
                        <label for="pizza-style" class="visually-hidden">Pizza Style</label>
                        <select id="pizza-style" name="pizza_style" required>
                            <option value="" disabled selected>Pizza Style</option>
                            <option value="neapolitan">Neapolitan</option>
                            <option value="new-york">New York</option>
                            <option value="by-the-slice">By the Slice</option>
                            <option value="modern">Modern</option>
                            <option value="taglio">Taglio</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description" class="visually-hidden">Why do you recommend it?</label>
                        <textarea id="description" name="description" rows="5" placeholder="Why do you recommend it?" required></textarea>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="confirm" name="confirm" required>
                        <label for="confirm">I confirm this is my honest and respectful submission.</label>
                    </div>

                    <div class="form-button">
                        <button type="submit">Send</button>
                    </div>
                </form>
                </section>
            </div>

        </main>

        <!-- Shared footer repeats the social links and site copyright. -->
        <footer>
            <div class="footer-socials">
                <a href="#" class="footer-social-link footer-social-link--instagram" title="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                </a>
                <a href="#" class="footer-social-link footer-social-link--tiktok" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>TikTok</span>
                </a>
                <a href="#" class="footer-social-link footer-social-link--facebook" title="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                    <span>Facebook</span>
                </a>
            </div>
            <p>&copy; 2026 Vancity Pizza Guide</p>
        </footer>
        
    </body>
</html>
